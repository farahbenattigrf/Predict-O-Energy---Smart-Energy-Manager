
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predict'O Energy - Energy Alert Manager</title>
<style>
body{font-family:Arial;background:#101c2c;color:white;text-align:center;padding:25px}
main{background:#1d3045;padding:25px;border-radius:15px;max-width:460px;margin:auto}
.header{display:flex;align-items:center;justify-content:center;gap:10px}
.logo{width:45px;height:45px;object-fit:contain}
h1{color:#20c997;font-size:23px}
input{display:block;padding:12px;margin:10px auto;width:90%;border:0;border-radius:7px}
button{padding:12px 25px;background:#20c997;border:0;border-radius:7px;cursor:pointer}
#result{text-align:left;line-height:2;margin-top:20px}
</style>
</head>
<body>
<main>
<div class="header">
<img src="images%20(1).jpg" class="logo" alt="Logo">
<h1>Predict'O Energy</h1>
</div>
<h2>Energy Alert Manager</h2>
<p>Smart Energy Monitoring & Forecasting</p>
<input id="p" type="number" placeholder="Power (W)">
<input id="h" type="number" placeholder="Hours per day">
<input id="j" type="number" placeholder="Days per month">
<input id="t" type="number" placeholder="Price per kWh (DT)">
<input id="s" type="number" placeholder="Monthly threshold (kWh)">
<input id="v" type="number" value="10" placeholder="Forecast change (%)">
<button onclick="calculer()">Analyze</button>
<div id="result"></div>
</main>
<script>
function calculer(){
let [p,h,j,t,s,v]=["p","h","j","t","s","v"].map(id=>document.getElementById(id).value.trim()===""?NaN:Number(document.getElementById(id).value));
let r=document.getElementById("result");
if(![p,h,j,t,s,v].every(Number.isFinite)||p<=0||h<=0||h>24||j<=0||j>31||t<0||s<=0||v< -100){r.innerHTML="⚠️ Check your values.";return;}
let c=p*h*j/1000, cost=c*t, f=c*(1+v/100), fc=f*t;
r.innerHTML=`<hr>Current consumption: ${c.toFixed(2)} kWh<br>Current cost: ${cost.toFixed(2)} DT<hr>Forecast: ${f.toFixed(2)} kWh<br>Forecast cost: ${fc.toFixed(2)} DT<br>Change: ${v}%<hr><b>${f>s?"⚠️ ALERT: Threshold exceeded!":"✅ Normal consumption"}</b>`;
}
</script>
</body>
</html>
